name: Amir Dev Brain Dashboard CI

on:
  push:
    branches: [main, feature/premium-dashboard-scaffold]
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard-ci.yml"

permissions:
  contents: read

jobs:
  verify-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
