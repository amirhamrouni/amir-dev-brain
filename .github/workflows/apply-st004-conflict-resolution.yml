name: Apply ST-004 Conflict Resolution

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20260907163000_st004_conflict_resolution.sql"
      - ".github/workflows/apply-st004-conflict-resolution.yml"
      - "decisions/APPROVED_DECISIONS.md"

permissions:
  contents: read

jobs:
  apply-and-capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ST-004 unit tests
        run: node --test tests/st004-conflict-resolution-core.test.mjs

      - name: Apply ST-004 database migration through Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          sql = Path('supabase/migrations/20260907163000_st004_conflict_resolution.sql').read_text()
          Path('migration-payload.json').write_text(json.dumps({'query': sql}), encoding='utf-8')
          PY
          HTTP_CODE=$(curl --silent --show-error \
            --output migration-result.json \
            --write-out '%{http_code}' \
            --request POST \
            'https://api.supabase.com/v1/projects/hdcpvwsndxxflbednvsq/database/query' \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'content-type: application/json' \
            --data @migration-payload.json)
          cat migration-result.json
          case "$HTTP_CODE" in 2*) ;; *) echo "Unexpected migration HTTP $HTTP_CODE"; exit 1 ;; esac

      - name: Verify ST-004 schema and invalidation trigger
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          query = """
          select
            exists(
              select 1 from information_schema.columns
              where table_schema='public' and table_name='thoughts' and column_name='conflict_source'
            ) as conflict_source_exists,
            exists(
              select 1 from information_schema.columns
              where table_schema='public' and table_name='thoughts' and column_name='resolution_status'
            ) as resolution_status_exists,
            exists(
              select 1 from information_schema.columns
              where table_schema='public' and table_name='thoughts' and column_name='blocked_action'
            ) as blocked_action_exists,
            to_regclass('public.open_brain_metadata_cache')::text as cache_table,
            exists(
              select 1 from pg_trigger
              where tgrelid='public.thoughts'::regclass
                and tgname='trg_invalidate_open_brain_metadata_cache'
                and not tgisinternal
            ) as trigger_exists;
          """
          open('verify-payload.json','w').write(json.dumps({'query':query}))
          PY
          HTTP_CODE=$(curl --silent --show-error \
            --output verify-result.json \
            --write-out '%{http_code}' \
            --request POST \
            'https://api.supabase.com/v1/projects/hdcpvwsndxxflbednvsq/database/query' \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'content-type: application/json' \
            --data @verify-payload.json)
          cat verify-result.json
          case "$HTTP_CODE" in 2*) ;; *) echo "Unexpected verification HTTP $HTTP_CODE"; exit 1 ;; esac
          python - <<'PY'
          import json
          data=json.load(open('verify-result.json'))
          rows=data if isinstance(data, list) else data.get('result', data.get('data', []))
          if not rows or not isinstance(rows[0], dict):
              raise SystemExit('ST-004 verification returned no row: '+str(data))
          row=rows[0]
          required=['conflict_source_exists','resolution_status_exists','blocked_action_exists','trigger_exists']
          missing=[k for k in required if row.get(k) is not True]
          if missing:
              raise SystemExit('ST-004 verification failed fields '+str(missing)+': '+str(row))
          cache=str(row.get('cache_table') or '')
          if cache not in ('open_brain_metadata_cache','public.open_brain_metadata_cache'):
              raise SystemExit('ST-004 metadata cache table verification failed: '+str(row))
          print('Verified ST-004 thoughts metadata columns, metadata cache table, and invalidation trigger')
          PY

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Generate one-shot runner token
        id: token
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(openssl rand -hex 32)
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$TOKEN"

      - name: Set temporary runner secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RUNNER_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          supabase secrets set COUNCIL_RUNNER_TOKEN="$RUNNER_TOKEN" --project-ref hdcpvwsndxxflbednvsq

      - name: Deploy one-shot E2E runner
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy council-e2e-runner \
            --project-ref hdcpvwsndxxflbednvsq \
            --no-verify-jwt \
            --use-api

      - name: Capture ST-004 approved decision in Open Brain
        env:
          RUNNER_TOKEN: ${{ steps.token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          content = '''APPROVED DECISION — ST-004: Dev Brain Conflict Resolution Mechanism. Project: amir-dev-brain. Authority: Amir. Decision date: 2026-09-07. Flag & Include remains the default for informational conflicts; a CONFLICT_FLAG alone never stops a Council debate. Deterministic fail-fast is allowed only when a pending executable Tool Call or Action matches an explicit governance rule showing that execution would violate an Approved Decision. Merely retrieving conflicting approved memories does not halt the session. blocked_action is rule-driven only, never model-judged. Thoughts support conflict_source, resolution_status, and blocked_action. Metadata cache entries are invalidated automatically when superseded_by or resolution_status changes. When fail-fast triggers, execution stops with an explicit Amir-intervention-required result listing violated decision IDs and reasons. Evidence: Council thought 5a9b3aa1-d4c5-4474-9cc2-96acce5aecea and Amir explicit approval on 2026-09-07. Status: approved.'''
          open('capture-payload.json','w').write(json.dumps({'tool_name':'capture_thought','content':content}))
          PY
          HTTP_CODE=$(curl --silent --show-error \
            --output capture-result.json \
            --write-out '%{http_code}' \
            --request POST \
            'https://hdcpvwsndxxflbednvsq.supabase.co/functions/v1/council-e2e-runner' \
            --header "x-runner-token: $RUNNER_TOKEN" \
            --header 'content-type: application/json' \
            --data @capture-payload.json)
          cat capture-result.json
          test "$HTTP_CODE" = "200"
          python - <<'PY'
          import json
          data=json.load(open('capture-result.json'))
          if not data.get('ok') or data.get('tool') != 'capture_thought':
              raise SystemExit('Open Brain capture failed: '+str(data))
          print('ST-004 captured in Open Brain successfully')
          PY

      - name: Upload ST-004 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: st004-conflict-resolution-evidence
          path: |
            migration-result.json
            verify-result.json
            capture-result.json
          if-no-files-found: warn

      - name: Remove temporary runner secret
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase secrets unset COUNCIL_RUNNER_TOKEN --project-ref hdcpvwsndxxflbednvsq || true
          fi
