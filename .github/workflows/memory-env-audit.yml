name: Memory API Vercel Env Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/memory-env-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_UKAtfO6HzAtWy9WQ5YuXlPLC
      TARGET_PROJECT_ID: prj_jFc0iqPP0ofyCATBibwmGQbpLMjZ
      GH_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GH_QDRANT_URL: ${{ secrets.QDRANT_URL }}
      GH_QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      GH_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Inspect required variable metadata only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"

          curl --fail-with-body --silent --show-error \
            "https://api.vercel.com/v9/projects?teamId=${VERCEL_ORG_ID}&limit=100" \
            --header "authorization: Bearer ${VERCEL_TOKEN}" \
            --output /tmp/vercel-projects.json

          python - <<'PY'
          import json
          projects=json.load(open('/tmp/vercel-projects.json',encoding='utf-8')).get('projects',[])
          with open('/tmp/project-index.tsv','w',encoding='utf-8') as f:
              for p in projects:
                  pid=p.get('id','')
                  name=p.get('name','')
                  if pid:
                      f.write(f'{pid}\t{name}\n')
          PY

          : > /tmp/env-audit.tsv
          while IFS=$'\t' read -r PROJECT_ID PROJECT_NAME; do
            curl --fail-with-body --silent --show-error \
              "https://api.vercel.com/v10/projects/${PROJECT_ID}/env?teamId=${VERCEL_ORG_ID}" \
              --header "authorization: Bearer ${VERCEL_TOKEN}" \
              --output /tmp/project-envs.json
            PROJECT_ID="$PROJECT_ID" PROJECT_NAME="$PROJECT_NAME" python - <<'PY'
          import json, os
          required={'DATABASE_URL','QDRANT_URL','QDRANT_API_KEY','OPENAI_API_KEY'}
          envs=json.load(open('/tmp/project-envs.json',encoding='utf-8')).get('envs',[])
          rows=[]
          for item in envs:
              key=item.get('key')
              if key not in required:
                  continue
              targets=','.join(item.get('target') or [])
              rows.append((key,targets,item.get('type') or '',item.get('gitBranch') or ''))
          if rows:
              with open('/tmp/env-audit.tsv','a',encoding='utf-8') as f:
                  for key,targets,typ,branch in rows:
                      f.write(f"{os.environ['PROJECT_ID']}\t{os.environ['PROJECT_NAME']}\t{key}\t{targets}\t{typ}\t{branch}\n")
          PY
          done < /tmp/project-index.tsv

          python - <<'PY'
          import os
          target=os.environ['TARGET_PROJECT_ID']
          rows=[]
          if os.path.exists('/tmp/env-audit.tsv'):
              for raw in open('/tmp/env-audit.tsv',encoding='utf-8'):
                  parts=raw.rstrip('\n').split('\t')
                  if len(parts) >= 6:
                      rows.append(parts)
          print('--- Required-key locations; values are never printed ---')
          for pid,name,key,targets,typ,branch in rows:
              marker='TARGET' if pid == target else 'OTHER'
              print(f'{marker} project={name} id={pid} key={key} targets={targets} type={typ} branch={branch or "none"}')
          required=['DATABASE_URL','QDRANT_URL','QDRANT_API_KEY','OPENAI_API_KEY']
          target_keys={r[2] for r in rows if r[0] == target and 'production' in r[3].split(',') and not r[5]}
          print('target_missing_production=' + ','.join(k for k in required if k not in target_keys))
          print('--- GitHub Actions secret presence only ---')
          mapping={
              'DATABASE_URL':'GH_DATABASE_URL',
              'QDRANT_URL':'GH_QDRANT_URL',
              'QDRANT_API_KEY':'GH_QDRANT_API_KEY',
              'OPENAI_API_KEY':'GH_OPENAI_API_KEY',
          }
          for key, env_name in mapping.items():
              print(f'{key}: github_secret_present={bool(os.environ.get(env_name))}')
          PY
