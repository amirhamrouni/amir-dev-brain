name: Memory API Vercel Env Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/memory-env-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_UKAtfO6HzAtWy9WQ5YuXlPLC
      VERCEL_PROJECT_ID: prj_jFc0iqPP0ofyCATBibwmGQbpLMjZ
      GH_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GH_QDRANT_URL: ${{ secrets.QDRANT_URL }}
      GH_QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      GH_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Inspect required variable metadata only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          curl --fail-with-body --silent --show-error \
            "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_ORG_ID}" \
            --header "authorization: Bearer ${VERCEL_TOKEN}" \
            --output /tmp/vercel-envs.json
          python - <<'PY'
          import json, os
          data=json.load(open('/tmp/vercel-envs.json',encoding='utf-8'))
          envs=data.get('envs', [])
          required=['DATABASE_URL','QDRANT_URL','QDRANT_API_KEY','OPENAI_API_KEY']
          found={}
          for item in envs:
              key=item.get('key')
              if key not in required:
                  continue
              targets=item.get('target') or []
              found.setdefault(key,[]).append({
                  'target': targets,
                  'type': item.get('type'),
                  'gitBranch': item.get('gitBranch'),
              })
          print('--- Vercel project metadata ---')
          for key in required:
              rows=found.get(key,[])
              prod=any('production' in (row.get('target') or []) and not row.get('gitBranch') for row in rows)
              print(f'{key}: present={bool(rows)} production={prod} metadata={rows}')
          missing=[key for key in required if not found.get(key)]
          print('missing_keys=' + ','.join(missing))
          print('--- GitHub Actions secret presence only ---')
          mapping={
              'DATABASE_URL':'GH_DATABASE_URL',
              'QDRANT_URL':'GH_QDRANT_URL',
              'QDRANT_API_KEY':'GH_QDRANT_API_KEY',
              'OPENAI_API_KEY':'GH_OPENAI_API_KEY',
          }
          for key, env_name in mapping.items():
              print(f'{key}: github_secret_present={bool(os.environ.get(env_name))}')
          PY
