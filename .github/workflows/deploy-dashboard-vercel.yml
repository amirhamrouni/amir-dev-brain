name: Deploy Amir Dev Brain Dashboard to Vercel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-dashboard-vercel.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    env:
      VERCEL_ORG_ID: team_UKAtfO6HzAtWy9WQ5YuXlPLC
      VERCEL_PROJECT_ID: prj_jFc0iqPP0ofyCATBibwmGQbpLMjZ
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_MODEL: gemini-3.5-flash-lite
      VERCEL_CLI_VERSION: 59.11.7
      VERCEL_TELEMETRY_DISABLED: 1
      CI: 1
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require deployment secrets
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN GitHub secret is required." >&2
            exit 1
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY GitHub secret is required for Council v1.5." >&2
            exit 1
          fi
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not present in GitHub Actions; Vercel production env may still provide it."
          fi

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-fund

      - name: Normalize Vercel project for Next.js runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}" \
            --header "authorization: Bearer ${VERCEL_TOKEN}" \
            --header 'content-type: application/json' \
            --data '{"framework":"nextjs","outputDirectory":null,"buildCommand":"npm run build"}' \
            --output /tmp/vercel-project.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/vercel-project.json',encoding='utf-8'))
          assert data.get('framework') == 'nextjs', data.get('framework')
          assert data.get('outputDirectory') in (None, ''), data.get('outputDirectory')
          print('Vercel project normalized for dynamic Next.js runtime')
          PY

      - name: Reset local Vercel link state
        run: rm -rf .vercel

      - name: Link Vercel project explicitly
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" link --yes --project=amir-brain-console --scope=amirhamrounis-projects --token="$VERCEL_TOKEN"

      - name: Pull production configuration
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production --scope=amirhamrounis-projects --token="$VERCEL_TOKEN"

      - name: Build production dashboard
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" build --prod --scope=amirhamrounis-projects --token="$VERCEL_TOKEN"

      - name: Deploy production dashboard from source
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_ARGS=(
            --prod
            --yes
            --scope=amirhamrounis-projects
            --token="$VERCEL_TOKEN"
            --env GEMINI_API_KEY="$GEMINI_API_KEY"
            --env GEMINI_MODEL="$GEMINI_MODEL"
          )
          if [ -n "$OPENAI_API_KEY" ]; then
            DEPLOY_ARGS+=(--env OPENAI_API_KEY="$OPENAI_API_KEY")
          fi
          npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy "${DEPLOY_ARGS[@]}" > deployment-url.txt
          cat deployment-url.txt
          DEPLOYMENT_URL="$(tail -n 1 deployment-url.txt | tr -d '\r')"
          test -n "$DEPLOYMENT_URL"
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test live Council v1.5 stream
        env:
          PUBLIC_PRODUCTION_URL: https://amir-brain-console.vercel.app
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          payload = {
            "userQuery": "اختبار إنتاج Council v1.5: أجب كل دور بإيجاز شديد. على Critic تضمين [CONFLICT] وعلى Judge إنهاء القرار بـ [SYNTHESIS]."
          }
          open('/tmp/council-v15-payload.json','w',encoding='utf-8').write(json.dumps(payload,ensure_ascii=False))
          PY

          READY=0
          GATED=0
          for attempt in 1 2 3 4 5; do
            rm -f /tmp/council-v15.txt /tmp/council-v15.headers
            HTTP_CODE=$(curl --silent --show-error --no-buffer --max-time 59 \
              --write-out '%{http_code}' \
              --dump-header /tmp/council-v15.headers \
              --request POST "$PUBLIC_PRODUCTION_URL/api/council/run" \
              --header 'content-type: application/json' \
              --data @/tmp/council-v15-payload.json \
              --output /tmp/council-v15.txt || true)

            if [ "$HTTP_CODE" = "503" ] && grep -q 'openai_api_key_missing' /tmp/council-v15.txt; then
              GATED=1
              READY=1
              echo "production_alias_attempt=$attempt state=openai-gated"
              break
            fi

            ACTIVE_VERSION=$(python - <<'PY'
          version=''
          try:
            with open('/tmp/council-v15.headers',encoding='utf-8',errors='ignore') as f:
              for raw in f:
                if raw.lower().startswith('x-council-version:'):
                  version=raw.split(':',1)[1].strip()
          except Exception:
            pass
          print(version)
          PY
            )
            ENGINEER_MODEL=$(python - <<'PY'
          model=''
          try:
            with open('/tmp/council-v15.headers',encoding='utf-8',errors='ignore') as f:
              for raw in f:
                if raw.lower().startswith('x-council-engineer-model:'):
                  model=raw.split(':',1)[1].strip()
          except Exception:
            pass
          print(model)
          PY
            )

            echo "production_alias_attempt=$attempt http=${HTTP_CODE:-none} version=${ACTIVE_VERSION:-none} engineer=${ENGINEER_MODEL:-none}"
            if [ "$HTTP_CODE" = "200" ] && [ "$ACTIVE_VERSION" = "v1.5" ] && [ "$ENGINEER_MODEL" = "gpt-4o-mini" ]; then
              READY=1
              break
            fi
            sleep 4
          done
          test "$READY" = "1"

          if [ "$GATED" = "1" ]; then
            echo "Council v1.5 is live but OpenAI Engineer is gated because the effective production OPENAI_API_KEY is missing."
            exit 0
          fi

          cat /tmp/council-v15.txt
          python - <<'PY'
          text=open('/tmp/council-v15.txt',encoding='utf-8').read()
          assert '### Error' not in text, text
          assert '[PARTIAL_RESPONSE]' not in text, 'a provider response was truncated or incomplete'
          assert '[ROLE_UNAVAILABLE]' not in text, 'a council role was unavailable'
          for role in ('Architect','Critic','Engineer','Judge'):
            assert f'### {role}' in text, role
          assert '[CONFLICT]' in text, 'missing conflict marker'
          assert '[SYNTHESIS]' in text, 'missing synthesis marker'
          assert len(text.strip()) > 200, 'stream unexpectedly short'
          print('Council v1.5 complete Gemini + OpenAI production stream E2E PASS')
          PY
