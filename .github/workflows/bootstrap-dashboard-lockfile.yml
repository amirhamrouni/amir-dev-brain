name: Bootstrap Dashboard Lockfile

on:
  push:
    branches: [feature/premium-dashboard-scaffold]
    paths:
      - "dashboard/**"
      - ".github/workflows/bootstrap-dashboard-lockfile.yml"

permissions:
  contents: write

jobs:
  verify-and-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/premium-dashboard-scaffold
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve dependencies and generate lockfile
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit verified package-lock
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          test -f dashboard/package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/package-lock.json
          if git diff --cached --quiet; then
            echo "Dashboard lockfile already current"
            exit 0
          fi
          git commit -m "Lock dashboard dependency graph"
          git push origin HEAD:feature/premium-dashboard-scaffold
