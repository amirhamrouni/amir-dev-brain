name: Test Gemini Brain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-gemini-brain.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Call Gemini Brain
        env:
          MCP_ACCESS_KEY: ${{ secrets.MCP_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MCP_ACCESS_KEY:-}" ]; then
            echo "Missing GitHub Actions secret: MCP_ACCESS_KEY"
            exit 1
          fi

          BODY_FILE=$(mktemp)
          STATUS=$(curl --silent --show-error \
            --output "$BODY_FILE" \
            --write-out "%{http_code}" \
            -X POST \
            -H "content-type: application/json" \
            -H "x-amir-key: ${MCP_ACCESS_KEY}" \
            -d '{"project_key":"amir-dev-brain","question":"What is Amir Dev Brain and what should be the next technical step?"}' \
            "https://hdcpvwsndxxflbednvsq.supabase.co/functions/v1/gemini-brain")

          echo "HTTP status: $STATUS"
          cat "$BODY_FILE" | jq . || cat "$BODY_FILE"

          if [ "$STATUS" != "200" ]; then
            echo "Gemini Brain returned HTTP $STATUS"
            exit 1
          fi

          jq -e '.ok == true and (.opinion | type == "string") and (.opinion | length > 0)' "$BODY_FILE" >/dev/null
          echo "Gemini Brain end-to-end test passed."