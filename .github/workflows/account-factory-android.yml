name: Amir Account Factory Android

on:
  workflow_dispatch:
  push:
    branches:
      - build/account-factory-android
    paths:
      - 'tools/account-factory-android-src/**'
      - 'tools/account-factory-android-patches/**'
      - '.github/workflows/account-factory-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/account-factory-android
          mkdir -p tools/account-factory-android
          cat tools/account-factory-android-src/part-*.b64 | base64 -d > /tmp/account-factory-android-src.zip
          unzip -q /tmp/account-factory-android-src.zip -d tools/account-factory-android
          if [ -d tools/account-factory-android-patches ]; then
            rsync -a tools/account-factory-android-patches/ tools/account-factory-android/
          fi
          test -f tools/account-factory-android/app/build.gradle
          unzip -t /tmp/account-factory-android-src.zip

      - name: Apply Android API compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('tools/account-factory-android/app/src/main/java/com/amir/accountfactory')

          p = root / 'WebAutomation.java'
          s = p.read_text()
          s = s.replace('Files.writeString(htmlFile.toPath(), html == null ? "" : html, StandardCharsets.UTF_8);',
                        'try (FileOutputStream out = new FileOutputStream(htmlFile)) { out.write((html == null ? "" : html).getBytes(StandardCharsets.UTF_8)); }')
          s = s.replace('Files.writeString(jsonFile.toPath(), meta.toString(2), StandardCharsets.UTF_8);',
                        'try (FileOutputStream out = new FileOutputStream(jsonFile)) { out.write(meta.toString(2).getBytes(StandardCharsets.UTF_8)); }')
          p.write_text(s)

          p = root / 'Runner.java'
          s = p.read_text()
          s = s.replace('Files.writeString(jp.toPath(),json.toString(2),StandardCharsets.UTF_8);',
                        'try (java.io.FileOutputStream out = new java.io.FileOutputStream(jp)) { out.write(json.toString(2).getBytes(StandardCharsets.UTF_8)); }')
          s = s.replace('Files.writeString(tp.toPath(),text.toString(),StandardCharsets.UTF_8);',
                        'try (java.io.FileOutputStream out = new java.io.FileOutputStream(tp)) { out.write(text.toString().getBytes(StandardCharsets.UTF_8)); }')
          p.write_text(s)

          # Java core APIs used by the first port but unavailable on minSdk 26.
          for p in root.glob('*.java'):
              s = p.read_text()
              s = s.replace('.isBlank()', '.trim().isEmpty()')
              s = re.sub(r'Set\.of\((.*?)\)', r'new java.util.HashSet<>(java.util.Arrays.asList(\1))', s, flags=re.S)
              p.write_text(s)
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Unit tests
        working-directory: tools/account-factory-android
        run: gradle --no-daemon testDebugUnitTest

      - name: Lint
        working-directory: tools/account-factory-android
        run: gradle --no-daemon lintDebug

      - name: Build debug APK
        working-directory: tools/account-factory-android
        run: gradle --no-daemon assembleDebug

      - name: APK integrity and checksum
        working-directory: tools/account-factory-android
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Amir-Account-Factory-Android-debug
          if-no-files-found: warn
          path: |
            tools/account-factory-android/app/build/outputs/apk/debug/app-debug.apk
            tools/account-factory-android/app/build/outputs/apk/debug/app-debug.apk.sha256
            tools/account-factory-android/app/build/reports/tests/testDebugUnitTest/
            tools/account-factory-android/app/build/reports/lint-results-debug.html
