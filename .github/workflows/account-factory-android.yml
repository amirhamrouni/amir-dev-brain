name: Amir Account Factory Android

on:
  workflow_dispatch:
  push:
    branches:
      - build/account-factory-android
    paths:
      - 'tools/account-factory-android-src/**'
      - 'tools/account-factory-android-patches/**'
      - '.github/workflows/account-factory-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/account-factory-android
          mkdir -p tools/account-factory-android
          cat tools/account-factory-android-src/part-*.b64 | base64 -d > /tmp/account-factory-android-src.zip
          unzip -q /tmp/account-factory-android-src.zip -d tools/account-factory-android
          if [ -d tools/account-factory-android-patches ]; then
            rsync -a tools/account-factory-android-patches/ tools/account-factory-android/
          fi
          test -f tools/account-factory-android/app/build.gradle
          unzip -t /tmp/account-factory-android-src.zip

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Unit tests
        working-directory: tools/account-factory-android
        run: gradle --no-daemon testDebugUnitTest

      - name: Lint
        working-directory: tools/account-factory-android
        run: gradle --no-daemon lintDebug

      - name: Build debug APK
        working-directory: tools/account-factory-android
        run: gradle --no-daemon assembleDebug

      - name: APK integrity and checksum
        working-directory: tools/account-factory-android
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Amir-Account-Factory-Android-debug
          if-no-files-found: warn
          path: |
            tools/account-factory-android/app/build/outputs/apk/debug/app-debug.apk
            tools/account-factory-android/app/build/outputs/apk/debug/app-debug.apk.sha256
            tools/account-factory-android/app/build/reports/tests/testDebugUnitTest/
            tools/account-factory-android/app/build/reports/lint-results-debug.html
