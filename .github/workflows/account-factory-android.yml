name: Amir Account Factory Android

on:
  workflow_dispatch:
  push:
    branches:
      - build/account-factory-android
    paths:
      - 'tools/account-factory-android-src/**'
      - 'tools/account-factory-android-patches/**'
      - '.github/workflows/account-factory-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/account-factory-android
          mkdir -p tools/account-factory-android
          cat tools/account-factory-android-src/part-*.b64 | base64 -d > /tmp/account-factory-android-src.zip
          unzip -q /tmp/account-factory-android-src.zip -d tools/account-factory-android
          if [ -d tools/account-factory-android-patches ]; then
            rsync -a tools/account-factory-android-patches/ tools/account-factory-android/
          fi
          test -f tools/account-factory-android/app/build.gradle
          unzip -t /tmp/account-factory-android-src.zip

      - name: Apply Android runtime fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('tools/account-factory-android/app/src/main/java/com/amir/accountfactory')

          p = root / 'WebAutomation.java'
          s = p.read_text()
          s = s.replace('Files.writeString(htmlFile.toPath(), html == null ? "" : html, StandardCharsets.UTF_8);',
                        'try (FileOutputStream out = new FileOutputStream(htmlFile)) { out.write((html == null ? "" : html).getBytes(StandardCharsets.UTF_8)); }')
          s = s.replace('Files.writeString(jsonFile.toPath(), meta.toString(2), StandardCharsets.UTF_8);',
                        'try (FileOutputStream out = new FileOutputStream(jsonFile)) { out.write(meta.toString(2).getBytes(StandardCharsets.UTF_8)); }')
          p.write_text(s)

          p = root / 'Runner.java'
          s = p.read_text()
          s = s.replace('Files.writeString(jp.toPath(),json.toString(2),StandardCharsets.UTF_8);',
                        'try (java.io.FileOutputStream out = new java.io.FileOutputStream(jp)) { out.write(json.toString(2).getBytes(StandardCharsets.UTF_8)); }')
          s = s.replace('Files.writeString(tp.toPath(),text.toString(),StandardCharsets.UTF_8);',
                        'try (java.io.FileOutputStream out = new java.io.FileOutputStream(tp)) { out.write(text.toString().getBytes(StandardCharsets.UTF_8)); }')
          p.write_text(s)

          p = root / 'CryptoBox.java'
          s = p.read_text()
          old = '''            byte[] iv = new byte[12];
            R.nextBytes(iv);
            Cipher c = Cipher.getInstance("AES/GCM/NoPadding");
            c.init(Cipher.ENCRYPT_MODE, key(), new GCMParameterSpec(128, iv));
            byte[] out = c.doFinal(plain.getBytes(StandardCharsets.UTF_8));'''
          new = '''            Cipher c = Cipher.getInstance("AES/GCM/NoPadding");
            c.init(Cipher.ENCRYPT_MODE, key());
            byte[] iv = c.getIV();
            byte[] out = c.doFinal(plain.getBytes(StandardCharsets.UTF_8));'''
          if old not in s:
              raise SystemExit('CryptoBox encrypt block not found')
          s = s.replace(old, new)
          p.write_text(s)

          p = root / 'MainActivity.java'
          s = p.read_text()
          s = s.replace('Button generate=button("GENERATE"); generate.setOnClickListener(v->generateBatch());',
                        'Button generate=button("GENERATE"); generate.setOnClickListener(v->safeGenerateBatch());')
          marker = '    private void generateBatch() {'
          guard = '    private void safeGenerateBatch() {\n        try { generateBatch(); }\n        catch (Throwable t) {\n            android.util.Log.e("AmirFactory", "GENERATE failed", t);\n            logUi("[FATAL] GENERATE " + t.getClass().getSimpleName() + ": " + String.valueOf(t.getMessage()));\n        }\n    }\n\n'
          if marker not in s:
              raise SystemExit('generateBatch marker not found')
          if 'private void safeGenerateBatch()' not in s:
              s = s.replace(marker, guard + marker)
          p.write_text(s)

          for p in root.glob('*.java'):
              s = p.read_text()
              s = s.replace('.isBlank()', '.trim().isEmpty()')
              s = re.sub(r'Set\.of\((.*?)\)', r'new java.util.HashSet<>(java.util.Arrays.asList(\1))', s, flags=re.S)
              p.write_text(s)
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android SDK + emulator
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Unit tests
        working-directory: tools/account-factory-android
        run: gradle --no-daemon testDebugUnitTest

      - name: Lint
        working-directory: tools/account-factory-android
        run: gradle --no-daemon lintDebug

      - name: Build debug APK
        working-directory: tools/account-factory-android
        run: gradle --no-daemon assembleDebug

      - name: Runtime smoke test - launch and press GENERATE
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/tools/account-factory-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          echo no | "$AVDMANAGER" create avd -n AmirFactoryCI -k "system-images;android-35;google_apis;x86_64" --force >/dev/null
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          nohup "$EMULATOR" -avd AmirFactoryCI -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none >/tmp/emulator.log 2>&1 &
          adb wait-for-device
          BOOTED=0
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then BOOTED=1; break; fi
            sleep 2
          done
          if [ "$BOOTED" != "1" ]; then cat /tmp/emulator.log; exit 1; fi
          adb shell input keyevent 82 || true
          adb install -r "$APK"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          PKG=$("$AAPT" dump badging "$APK" | sed -n "s/package: name='\([^']*\)'.*/\1/p" | head -1)
          ACT=$("$AAPT" dump badging "$APK" | sed -n "s/launchable-activity: name='\([^']*\)'.*/\1/p" | head -1)
          test -n "$PKG" && test -n "$ACT"
          adb logcat -c
          adb shell am start -W -n "$PKG/$ACT"
          sleep 3
          adb shell uiautomator dump /sdcard/window.xml >/dev/null
          adb pull /sdcard/window.xml /tmp/window.xml >/dev/null
          python3 - <<'PY' >/tmp/tap.txt
          import re, xml.etree.ElementTree as ET
          root=ET.parse('/tmp/window.xml').getroot()
          for n in root.iter('node'):
              if n.attrib.get('text','').strip().upper() == 'GENERATE':
                  m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', n.attrib.get('bounds',''))
                  if m:
                      x1,y1,x2,y2=map(int,m.groups()); print((x1+x2)//2,(y1+y2)//2); raise SystemExit
          raise SystemExit('GENERATE button not found')
          PY
          read X Y </tmp/tap.txt
          adb shell input tap "$X" "$Y"
          sleep 5
          PID=$(adb shell pidof "$PKG" | tr -d '\r')
          if [ -z "$PID" ]; then
            echo 'APP CRASHED AFTER GENERATE'
            adb logcat -d | tail -500
            exit 1
          fi
          adb shell uiautomator dump /sdcard/after.xml >/dev/null
          adb pull /sdcard/after.xml /tmp/after.xml >/dev/null
          if ! grep -q 'text="TOTAL 20' /tmp/after.xml; then
            echo 'GENERATE did not produce 20 platform rows'
            cat /tmp/after.xml
            echo '--- LOGCAT ---'
            adb logcat -d | tail -500
            exit 1
          fi
          echo "RUNTIME_GENERATE_PASS package=$PKG pid=$PID"

      - name: APK integrity and checksum
        working-directory: tools/account-factory-android
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Amir-Account-Factory-Android-runtime-tested
          if-no-files-found: warn
          path: |
            tools/account-factory-android/app/build/outputs/apk/debug/app-debug.apk
            tools/account-factory-android/app/build/outputs/apk/debug/app-debug.apk.sha256
            tools/account-factory-android/app/build/reports/tests/testDebugUnitTest/
            tools/account-factory-android/app/build/reports/lint-results-debug.html
