name: Sync Google Generative AI Lockfile

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-google-generative-ai-lock.yml"

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Refresh npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-fund

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          cd ..
          if git diff --quiet -- dashboard/package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/package-lock.json
          git commit -m "Sync Google Generative AI SDK lockfile"
          git push origin HEAD:main
