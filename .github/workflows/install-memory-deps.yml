name: Install Memory API Dependencies

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-memory-deps.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install runtime and type dependencies
        working-directory: dashboard
        run: |
          npm install pg @qdrant/js-client-rest --save
          npm install -D @types/pg

      - name: Commit lockfile and package manifest
        run: |
          set -euo pipefail
          git config user.name "Amir Dev Brain Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard/package.json dashboard/package-lock.json
          if git diff --cached --quiet; then
            echo "Memory API dependencies already installed."
            exit 0
          fi
          git commit -m "Install Memory API database clients"
          git push origin HEAD:main
