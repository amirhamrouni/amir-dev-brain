name: Amir Account Factory v1.7 inspect

on:
  workflow_dispatch:
  push:
    branches:
      - build/account-factory-android
    paths:
      - '.github/workflows/account-factory-v15-inspect.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct current v1.6-patched source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/account-factory-android
          mkdir -p tools/account-factory-android
          cat tools/account-factory-android-src/part-*.b64 | base64 -d > /tmp/source.zip
          unzip -q /tmp/source.zip -d tools/account-factory-android
          python3 .github/scripts/fix_account_factory_v16.py
          mkdir -p /tmp/inspect
          for f in WebAutomation.java Runner.java MailTmClient.java OtpUtil.java Account.java PersonaGenerator.java FlowEngine.java JsScripts.java AppDb.java AppConfig.java; do
            cp "tools/account-factory-android/app/src/main/java/com/amir/accountfactory/$f" /tmp/inspect/ 2>/dev/null || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: aaf-v17-inspect
          path: /tmp/inspect/
