name: Account Factory Inspect

on:
  push:
    branches:
      - build/account-factory-android
    paths:
      - '.github/workflows/account-factory-inspect.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and inspect TikTok state machine
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/account-factory-android
          mkdir -p tools/account-factory-android
          cat tools/account-factory-android-src/part-*.b64 | base64 -d > /tmp/source.zip
          unzip -q /tmp/source.zip -d tools/account-factory-android
          python3 .github/scripts/fix_account_factory_v14.py
          ROOT=tools/account-factory-android/app/src/main/java/com/amir/accountfactory
          echo '=== JsScripts.java ==='
          cat "$ROOT/JsScripts.java"
          echo '=== WebAutomation.java ==='
          cat "$ROOT/WebAutomation.java"
          echo '=== Runner.java ==='
          cat "$ROOT/Runner.java"
          echo '=== MailTmClient waitForCode ==='
          grep -n -A120 -B20 'waitForCode' "$ROOT/MailTmClient.java" || true
