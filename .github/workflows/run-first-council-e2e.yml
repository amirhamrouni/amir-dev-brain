name: Run Autonomous Council E2E

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/run-first-council-e2e.yml"
      - "supabase/functions/council-e2e-runner/**"
  workflow_dispatch:
    inputs:
      project_slug:
        description: "Amir Dev Brain project slug"
        required: true
        default: "amir-dev-brain"
        type: string
      question:
        description: "Council debate topic/question"
        required: true
        default: "dev-brain-dashboard-premium-ui-architecture"
        type: string
      rounds:
        description: "Council debate rounds"
        required: true
        default: "2"
        type: string

permissions:
  contents: read

jobs:
  council-e2e:
    runs-on: ubuntu-latest
    env:
      PROJECT_SLUG: amir-dev-brain
      COUNCIL_ROUNDS: "2"
      COUNCIL_QUESTION: >-
        dev-brain-dashboard-premium-ui-architecture. Design the premium visual dashboard for Amir Dev Brain AI Council. Debate deeply between analysis and engineering sides about multi-agent conversation UX, split-screen versus threaded views, provenance, conflict visibility, live-status indicators, and cognitive load; evaluate Next.js App Router, Tailwind CSS, Motion for React, and Supabase Realtime; define a concrete layout for two model sides debating, round navigation, retrieved memory/provenance, conflict flags, and a final Synthesis panel with Amir-only Approve/Reject actions that persist decisions to Open Brain through governed backend actions; cover realtime architecture, security boundaries, responsive/mobile UX, accessibility, and MVP versus post-MVP scope. Use only these supplied verified source facts: Next.js official docs describe App Router as the newer router with Server Components. Supabase official docs say Realtime supports Broadcast, Presence and Postgres Changes, and recommend Broadcast for scalability/security while Postgres Changes is simpler but scales less well. Motion for React is the current Framer Motion React animation library with production-grade layout, gesture and scroll animations plus reduced-motion accessibility support. Source references supplied: nextjs.org/docs ; supabase.com/docs/guides/realtime ; supabase.com/docs/guides/realtime/subscribing-to-database-changes ; motion.dev/docs/react. Do not invent research citations beyond these sources. Return a concrete component/layout architecture, data flow, state model, animation principles, responsive behavior, and exact approval flow.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Generate one-shot runner token
        id: token
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(openssl rand -hex 32)
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$TOKEN"

      - name: Set temporary runner secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RUNNER_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          supabase secrets set COUNCIL_RUNNER_TOKEN="$RUNNER_TOKEN" --project-ref hdcpvwsndxxflbednvsq

      - name: Deploy one-shot E2E runner
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy council-e2e-runner --project-ref hdcpvwsndxxflbednvsq --no-verify-jwt --use-api

      - name: Run dynamic council E2E
        env:
          RUNNER_TOKEN: ${{ steps.token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          payload = {"project_slug": os.environ["PROJECT_SLUG"], "question": os.environ["COUNCIL_QUESTION"], "rounds": int(os.environ["COUNCIL_ROUNDS"])}
          open("council-payload.json","w",encoding="utf-8").write(json.dumps(payload,ensure_ascii=False))
          PY
          HTTP_CODE=$(curl --silent --show-error --output council-e2e-result.json --write-out '%{http_code}' --request POST 'https://hdcpvwsndxxflbednvsq.supabase.co/functions/v1/council-e2e-runner' --header "x-runner-token: $RUNNER_TOKEN" --header 'content-type: application/json' --data @council-payload.json)
          cat council-e2e-result.json
          test "$HTTP_CODE" = "200"
          python - <<'PY'
          import json
          data=json.load(open('council-e2e-result.json',encoding='utf-8'))
          if not data.get('ok'): raise SystemExit(str(data))
          text=' '.join(str(x.get('text','')) for x in data.get('result',{}).get('content',[]) if isinstance(x,dict))
          if 'Saved to Open Brain thought:' not in text: raise SystemExit('Council result did not confirm Open Brain persistence')
          PY

      - name: Upload council result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-council-result
          path: |
            council-payload.json
            council-e2e-result.json
          if-no-files-found: warn

      - name: Remove temporary runner secret
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          supabase secrets unset COUNCIL_RUNNER_TOKEN --project-ref hdcpvwsndxxflbednvsq || true
