name: Run Autonomous Council E2E

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/run-first-council-e2e.yml"
      - "supabase/functions/council-e2e-runner/**"
  workflow_dispatch:
    inputs:
      project_slug:
        description: "Amir Dev Brain project slug"
        required: true
        default: "amir-dev-brain"
        type: string
      question:
        description: "Council debate topic/question"
        required: true
        default: "english-twin-architecture-and-memory-separation"
        type: string
      rounds:
        description: "Council debate rounds"
        required: true
        default: "2"
        type: string

permissions:
  contents: read

jobs:
  council-e2e:
    runs-on: ubuntu-latest
    env:
      PROJECT_SLUG: ${{ github.event.inputs.project_slug || 'amir-dev-brain' }}
      COUNCIL_QUESTION: ${{ github.event.inputs.question || 'english-twin-architecture-and-memory-separation' }}
      COUNCIL_ROUNDS: ${{ github.event.inputs.rounds || '2' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Generate one-shot runner token
        id: token
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(openssl rand -hex 32)
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$TOKEN"

      - name: Set temporary runner secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RUNNER_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          supabase secrets set COUNCIL_RUNNER_TOKEN="$RUNNER_TOKEN" --project-ref hdcpvwsndxxflbednvsq

      - name: Deploy one-shot E2E runner
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy council-e2e-runner \
            --project-ref hdcpvwsndxxflbednvsq \
            --no-verify-jwt \
            --use-api

      - name: Run dynamic council E2E
        env:
          RUNNER_TOKEN: ${{ steps.token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          payload = {
              "project_slug": os.environ["PROJECT_SLUG"],
              "question": os.environ["COUNCIL_QUESTION"],
              "rounds": int(os.environ["COUNCIL_ROUNDS"]),
          }
          with open("council-payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)
          print("Council request:", json.dumps(payload, ensure_ascii=False))
          PY

          HTTP_CODE=$(curl --silent --show-error \
            --output council-e2e-result.json \
            --write-out '%{http_code}' \
            --request POST \
            'https://hdcpvwsndxxflbednvsq.supabase.co/functions/v1/council-e2e-runner' \
            --header "x-runner-token: $RUNNER_TOKEN" \
            --header 'content-type: application/json' \
            --data @council-payload.json)
          echo "Council runner HTTP $HTTP_CODE"
          cat council-e2e-result.json
          python - <<'PY'
          import json
          data=json.load(open('council-e2e-result.json', encoding='utf-8'))
          if not data.get('ok'):
              raise SystemExit('Council runner returned failure: '+str(data))
          text=' '.join(str(x.get('text','')) for x in data.get('result',{}).get('content',[]) if isinstance(x,dict))
          if 'Saved to Open Brain thought:' not in text:
              raise SystemExit('Council result did not confirm Open Brain persistence')
          print('Council E2E completed successfully and persisted to Open Brain')
          PY

      - name: Verify metadata cache populated by retrieval
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          q="select count(*)::int as cached_rows, max(cached_at) as latest_cached_at from public.open_brain_metadata_cache;"
          open('cache-verify-payload.json','w').write(json.dumps({'query':q}))
          PY
          HTTP_CODE=$(curl --silent --show-error \
            --output cache-verify-result.json \
            --write-out '%{http_code}' \
            --request POST \
            'https://api.supabase.com/v1/projects/hdcpvwsndxxflbednvsq/database/query' \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'content-type: application/json' \
            --data @cache-verify-payload.json)
          cat cache-verify-result.json
          case "$HTTP_CODE" in 2*) ;; *) echo "Unexpected cache verification HTTP $HTTP_CODE"; exit 1 ;; esac
          python - <<'PY'
          import json
          data=json.load(open('cache-verify-result.json'))
          rows=data if isinstance(data,list) else data.get('result',data.get('data',[]))
          if not rows or int(rows[0].get('cached_rows') or 0) < 1:
              raise SystemExit('Metadata cache was not populated by governed retrieval: '+str(data))
          print('Metadata cache populated:', rows[0])
          PY

      - name: Upload council result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-council-result
          path: |
            council-payload.json
            council-e2e-result.json
            cache-verify-result.json
          if-no-files-found: warn

      - name: Remove temporary runner secret
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase secrets unset COUNCIL_RUNNER_TOKEN --project-ref hdcpvwsndxxflbednvsq || true
          fi
