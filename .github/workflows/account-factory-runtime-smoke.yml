name: Amir Account Factory Runtime Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - build/account-factory-android
    paths:
      - '.github/workflows/account-factory-runtime-smoke.yml'

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Download fixed APK from build run
        uses: actions/download-artifact@v4
        with:
          name: Amir-Account-Factory-Android-runtime-tested
          path: /tmp/factory-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36338745589

      - name: Install emulator runtime
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "build-tools;36.0.0" "system-images;android-35;google_apis;x86_64"

      - name: Boot emulator, install APK, press GENERATE
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find /tmp/factory-artifact -type f -name '*.apk' | head -1)
          test -s "$APK"
          ADB="$ANDROID_HOME/platform-tools/adb"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          echo no | "$AVDMANAGER" create avd -n AmirFactoryCI -k "system-images;android-35;google_apis;x86_64" --force >/dev/null
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          ACCEL='-accel off'
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then ACCEL='-accel on'; fi
          nohup "$EMULATOR" -avd AmirFactoryCI -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect $ACCEL >/tmp/emulator.log 2>&1 &
          EMUPID=$!
          DEVICE=0
          for i in $(seq 1 90); do
            if "$ADB" devices | grep -q '^emulator-'; then DEVICE=1; break; fi
            if ! kill -0 "$EMUPID" 2>/dev/null; then echo 'EMULATOR EXITED'; cat /tmp/emulator.log; exit 1; fi
            sleep 2
          done
          if [ "$DEVICE" != "1" ]; then echo 'NO EMULATOR DEVICE'; cat /tmp/emulator.log; exit 1; fi
          BOOTED=0
          for i in $(seq 1 120); do
            if [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = '1' ]; then BOOTED=1; break; fi
            sleep 2
          done
          if [ "$BOOTED" != "1" ]; then echo 'EMULATOR BOOT TIMEOUT'; cat /tmp/emulator.log; exit 1; fi
          "$ADB" shell input keyevent 82 || true
          "$ADB" install -r "$APK"
          PKG=$("$AAPT" dump badging "$APK" | sed -n "s/package: name='\([^']*\)'.*/\1/p" | head -1)
          ACT=$("$AAPT" dump badging "$APK" | sed -n "s/launchable-activity: name='\([^']*\)'.*/\1/p" | head -1)
          test -n "$PKG" && test -n "$ACT"
          "$ADB" logcat -c
          "$ADB" shell am start -W -n "$PKG/$ACT"
          sleep 4
          "$ADB" shell uiautomator dump /sdcard/window.xml >/dev/null
          "$ADB" pull /sdcard/window.xml /tmp/window.xml >/dev/null
          python3 - <<'PY' >/tmp/tap.txt
          import re, xml.etree.ElementTree as ET
          root = ET.parse('/tmp/window.xml').getroot()
          for n in root.iter('node'):
              if n.attrib.get('text','').strip().upper() == 'GENERATE':
                  m = re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', n.attrib.get('bounds',''))
                  if m:
                      x1,y1,x2,y2 = map(int,m.groups())
                      print((x1+x2)//2, (y1+y2)//2)
                      raise SystemExit(0)
          raise SystemExit('GENERATE button not found')
          PY
          read X Y </tmp/tap.txt
          "$ADB" shell input tap "$X" "$Y"
          sleep 5
          PID=$("$ADB" shell pidof "$PKG" | tr -d '\r')
          if [ -z "$PID" ]; then
            echo 'APP CRASHED AFTER GENERATE'
            "$ADB" logcat -d | tail -700
            exit 1
          fi
          "$ADB" shell uiautomator dump /sdcard/after.xml >/dev/null
          "$ADB" pull /sdcard/after.xml /tmp/after.xml >/dev/null
          if grep -q '\[FATAL\] GENERATE' /tmp/after.xml; then
            echo 'GENERATE THREW BUT WAS CAUGHT'
            cat /tmp/after.xml
            "$ADB" logcat -d | tail -700
            exit 1
          fi
          if ! grep -q 'text="TOTAL 20' /tmp/after.xml; then
            echo 'GENERATE DID NOT CREATE 20 PLATFORM ACCOUNTS'
            cat /tmp/after.xml
            "$ADB" logcat -d | tail -700
            exit 1
          fi
          echo "RUNTIME_GENERATE_PASS package=$PKG pid=$PID"
