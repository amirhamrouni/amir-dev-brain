name: Video Factory

on:
  push:
    paths:
      - "video-factory/jobs/latest.json"
      - "video-factory/render_job.py"
      - "video-factory/preset.default.json"
      - ".github/workflows/video-factory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
    steps:
      - name: Checkout controller repo
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core git

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Clone MoneyPrinterTurbo
        run: git clone --depth 1 https://github.com/harry0703/MoneyPrinterTurbo.git MoneyPrinterTurbo

      - name: Install MoneyPrinterTurbo dependencies
        working-directory: MoneyPrinterTurbo
        run: uv sync --frozen

      - name: Preflight stock provider
        shell: bash
        run: |
          if [ -z "$PEXELS_API_KEY" ] && [ -z "$PIXABAY_API_KEY" ] && [ -z "$COVERR_API_KEY" ]; then
            echo "No free stock API key configured. Add one repository Actions secret: PEXELS_API_KEY (preferred), PIXABAY_API_KEY, or COVERR_API_KEY."
            exit 2
          fi

      - name: Validate job JSON
        run: python -m json.tool video-factory/jobs/latest.json >/dev/null

      - name: Render video
        run: |
          python video-factory/render_job.py \
            --job video-factory/jobs/latest.json \
            --mpt-dir MoneyPrinterTurbo \
            --preset video-factory/preset.default.json \
            --out-dir video-factory/out

      - name: Show QC
        if: always()
        shell: bash
        run: |
          if ls video-factory/out/*.qc.json >/dev/null 2>&1; then
            cat video-factory/out/*.qc.json
          fi

      - name: Upload rendered video
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: amir-video-factory-output
          path: |
            video-factory/out/*.mp4
            video-factory/out/*.qc.json
          if-no-files-found: error
          retention-days: 14
