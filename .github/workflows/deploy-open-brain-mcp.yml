name: Deploy Open Brain MCP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-open-brain-mcp.yml"
      - "supabase/**"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Prepare official OB1 MCP function
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supabase/functions/open-brain-mcp
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/NateBJones-Projects/OB1/main/server/index.ts \
            --output supabase/functions/open-brain-mcp/index.ts
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/NateBJones-Projects/OB1/main/server/deno.json \
            --output supabase/functions/open-brain-mcp/deno.json
          test -s supabase/functions/open-brain-mcp/index.ts
          test -s supabase/functions/open-brain-mcp/deno.json

      - name: Deploy open-brain-mcp
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy open-brain-mcp \
            --project-ref hdcpvwsndxxflbednvsq \
            --no-verify-jwt \
            --debug
