name: Deploy Open Brain MCP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-open-brain-mcp.yml"
      - "scripts/patch-open-brain.mjs"
      - "scripts/patch-council-orchestrator.mjs"
      - "supabase/**"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Prepare pinned OB1 MCP function
        shell: bash
        env:
          OB1_COMMIT: 9543c29a3e44a210ce278392b9fac11248997461
        run: |
          set -euo pipefail
          mkdir -p supabase/functions/open-brain-mcp
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/NateBJones-Projects/OB1/${OB1_COMMIT}/server/index.ts" \
            --output supabase/functions/open-brain-mcp/index.ts
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/NateBJones-Projects/OB1/${OB1_COMMIT}/server/deno.json" \
            --output supabase/functions/open-brain-mcp/deno.json
          test -s supabase/functions/open-brain-mcp/index.ts
          test -s supabase/functions/open-brain-mcp/deno.json

      - name: Add Amir project and GitHub tools
        run: node scripts/patch-open-brain.mjs supabase/functions/open-brain-mcp/index.ts

      - name: Add autonomous AI council orchestrator
        run: node scripts/patch-council-orchestrator.mjs supabase/functions/open-brain-mcp/index.ts

      - name: Normalize generated TypeScript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/open-brain-mcp/index.ts')
          s = p.read_text()
          s = s.replace('\\`', '`')
          p.write_text(s)
          PY

      - name: Verify patched tools exist
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'amir_project_context' supabase/functions/open-brain-mcp/index.ts
          grep -q 'github_repo_state' supabase/functions/open-brain-mcp/index.ts
          grep -q 'github_fetch_file' supabase/functions/open-brain-mcp/index.ts
          grep -q 'amir_council_debate' supabase/functions/open-brain-mcp/index.ts
          if grep -q '\\`' supabase/functions/open-brain-mcp/index.ts; then
            echo 'Escaped backticks remain in generated TypeScript'
            exit 1
          fi

      - name: Deploy open-brain-mcp
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy open-brain-mcp \
            --project-ref hdcpvwsndxxflbednvsq \
            --no-verify-jwt \
            --debug
