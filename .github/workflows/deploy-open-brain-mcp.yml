name: Deploy Open Brain MCP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-open-brain-mcp.yml"
      - "scripts/patch-open-brain.mjs"
      - "scripts/patch-council-orchestrator.mjs"
      - "scripts/patch-council-realtime-pre.mjs"
      - "scripts/patch-council-realtime-post.mjs"
      - "scripts/patch-council-reasoning.mjs"
      - "scripts/patch-council-free-tier.mjs"
      - "scripts/patch-st003-retrieval.mjs"
      - "scripts/st003-retrieval-core.mjs"
      - "tests/st003-retrieval-core.test.mjs"
      - "scripts/patch-st004-conflict-resolution.mjs"
      - "scripts/patch-st004-metadata-cache.mjs"
      - "scripts/st004-conflict-resolution-core.mjs"
      - "tests/st004-conflict-resolution-core.test.mjs"
      - "supabase/**"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ST-003 and ST-004 unit tests
        run: node --test tests/st003-retrieval-core.test.mjs tests/st004-conflict-resolution-core.test.mjs

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Prepare pinned OB1 MCP function
        shell: bash
        env:
          OB1_COMMIT: 9543c29a3e44a210ce278392b9fac11248997461
        run: |
          set -euo pipefail
          mkdir -p supabase/functions/open-brain-mcp
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/NateBJones-Projects/OB1/${OB1_COMMIT}/server/index.ts" \
            --output supabase/functions/open-brain-mcp/index.ts
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/NateBJones-Projects/OB1/${OB1_COMMIT}/server/deno.json" \
            --output supabase/functions/open-brain-mcp/deno.json
          test -s supabase/functions/open-brain-mcp/index.ts
          test -s supabase/functions/open-brain-mcp/deno.json

      - name: Add Amir project and GitHub tools
        run: node scripts/patch-open-brain.mjs supabase/functions/open-brain-mcp/index.ts

      - name: Add autonomous AI council orchestrator
        run: node scripts/patch-council-orchestrator.mjs supabase/functions/open-brain-mcp/index.ts

      - name: Apply legacy council budget patch
        run: node scripts/patch-council-reasoning.mjs supabase/functions/open-brain-mcp/index.ts

      - name: Switch council to zero-cost free-tier models
        run: node scripts/patch-council-free-tier.mjs supabase/functions/open-brain-mcp/index.ts

      - name: Add council realtime transcript hooks
        run: node scripts/patch-council-realtime-pre.mjs supabase/functions/open-brain-mcp/index.ts

      - name: Apply ST-003 governed memory retrieval
        run: node scripts/patch-st003-retrieval.mjs supabase/functions/open-brain-mcp/index.ts

      - name: Apply ST-004 deterministic conflict resolution
        run: node scripts/patch-st004-conflict-resolution.mjs supabase/functions/open-brain-mcp/index.ts

      - name: Apply ST-004 metadata cache read path
        run: node scripts/patch-st004-metadata-cache.mjs supabase/functions/open-brain-mcp/index.ts

      - name: Finalize council realtime handler
        run: node scripts/patch-council-realtime-post.mjs supabase/functions/open-brain-mcp/index.ts

      - name: Normalize generated TypeScript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/open-brain-mcp/index.ts')
          s = p.read_text()
          s = s.replace('\\`', '`')
          p.write_text(s)
          PY

      - name: Verify patched tools exist
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'amir_project_context' supabase/functions/open-brain-mcp/index.ts
          grep -q 'github_repo_state' supabase/functions/open-brain-mcp/index.ts
          grep -q 'github_fetch_file' supabase/functions/open-brain-mcp/index.ts
          grep -q 'amir_council_debate' supabase/functions/open-brain-mcp/index.ts
          grep -q 'councilRealtimeBroadcast' supabase/functions/open-brain-mcp/index.ts
          grep -q 'run_id: z.string' supabase/functions/open-brain-mcp/index.ts
          grep -q 'amir_retrieve_memory_context' supabase/functions/open-brain-mcp/index.ts
          grep -q 'amir_governance_preflight' supabase/functions/open-brain-mcp/index.ts
          grep -q 'retrieveSt003Context(topic, safe, 8)' supabase/functions/open-brain-mcp/index.ts
          grep -q 'match_thoughts_namespaced' supabase/functions/open-brain-mcp/index.ts
          grep -q 'p_target_language' supabase/functions/open-brain-mcp/index.ts
          grep -q 'target_language: z.string' supabase/functions/open-brain-mcp/index.ts
          grep -q 'cross_language: z.boolean' supabase/functions/open-brain-mcp/index.ts
          grep -q 'generationAdapterOpenRouter' supabase/functions/open-brain-mcp/index.ts
          grep -q 'generationAdapterGoogle' supabase/functions/open-brain-mcp/index.ts
          grep -q 'OPENROUTER_API_KEYS' supabase/functions/open-brain-mcp/index.ts
          grep -q 'GOOGLE_AI_STUDIO_API_KEYS' supabase/functions/open-brain-mcp/index.ts
          grep -q 'x-goog-api-key' supabase/functions/open-brain-mcp/index.ts
          grep -q 'st004FailFastDecision' supabase/functions/open-brain-mcp/index.ts
          grep -q 'pending_action' supabase/functions/open-brain-mcp/index.ts
          grep -q 'superseded_by' supabase/functions/open-brain-mcp/index.ts
          grep -q 'resolution_status' supabase/functions/open-brain-mcp/index.ts
          grep -q 'blocked_action' supabase/functions/open-brain-mcp/index.ts
          grep -q 'open_brain_metadata_cache' supabase/functions/open-brain-mcp/index.ts
          grep -q 'st004ReadCachedMetadata' supabase/functions/open-brain-mcp/index.ts
          grep -q 'st004WriteCachedMetadata' supabase/functions/open-brain-mcp/index.ts
          grep -q '\[CONFLICT_FLAG topics=' supabase/functions/open-brain-mcp/index.ts
          grep -q 'nvidia/nemotron-3-ultra-550b-a55b:free' supabase/functions/open-brain-mcp/index.ts
          grep -q 'minimax/minimax-m3:free' supabase/functions/open-brain-mcp/index.ts
          grep -q 'openrouter/free' supabase/functions/open-brain-mcp/index.ts
          grep -q 'max_tokens: 1800' supabase/functions/open-brain-mcp/index.ts
          if grep -q 'google/gemini-2.0-flash-exp:free' supabase/functions/open-brain-mcp/index.ts; then
            echo 'Stale Gemini free council model remains in generated server'
            exit 1
          fi
          if grep -q 'qwen/qwen-2.5-coder-32b-instruct:free' supabase/functions/open-brain-mcp/index.ts; then
            echo 'Stale Qwen free council model remains in generated server'
            exit 1
          fi
          if grep -q 'openai/gpt-5.6-luna-pro' supabase/functions/open-brain-mcp/index.ts; then
            echo 'Paid OpenAI council model remains in generated server'
            exit 1
          fi
          if grep -q 'google/gemini-2.5-pro' supabase/functions/open-brain-mcp/index.ts; then
            echo 'Paid Gemini council model remains in generated server'
            exit 1
          fi
          if grep -q '\\`' supabase/functions/open-brain-mcp/index.ts; then
            echo 'Escaped backticks remain in generated TypeScript'
            exit 1
          fi

      - name: Deploy open-brain-mcp
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy open-brain-mcp \
            --project-ref hdcpvwsndxxflbednvsq \
            --no-verify-jwt \
            --debug
